name: Supabase Keep-Alive

on:
  schedule:
    # Run every 4 days at 6AM UTC (10:30 AM IST)
    - cron: '0 6 */4 * *'
  workflow_dispatch:   # Allow manual trigger

jobs:
  ping:
    name: Ping Supabase to prevent pause
    runs-on: ubuntu-latest

    steps:
      - name: Ping backend health endpoint
        run: |
          curl -f "${{ secrets.BACKEND_URL }}/api/health" || echo "Backend ping done"

      - name: Log ping
        run: echo "Supabase keep-alive ping sent at $(date)"
